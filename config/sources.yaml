# AI RADAR source configuration — edit without touching code.
# Set enabled: false to skip a source. Priority affects scoring (high/medium/low).

github:
  enabled: true
  priority: high
  # Discovery strategy (content-grade):
  #  - broad topic queries catch established hot repos
  #  - created:+stars queries catch NEW repos gaining fame fast (best for content)
  #  - pushed: recent catches revived/updated stars
  queries:
    - "artificial-intelligence stars:>500 pushed:>2026-01-01"
    - "llm-agent stars:>200 pushed:>2026-01-01"
    - "mcp-server stars:>100 pushed:>2026-01-01"
    - "text-to-video stars:>100 pushed:>2026-01-01"
    - "ai-agents stars:>300 created:>2026-06-01"
    - "ai-coding stars:>300 pushed:>2026-08-01"
    - "generative-ai stars:>1000 pushed:>2026-08-01"
  per_query_limit: 20
  timeout: 15

huggingface:
  enabled: true
  priority: high
  # Public HF API, no key required.
  models_limit: 30
  spaces_limit: 15
  timeout: 15

openrouter:
  enabled: true
  priority: high
  # Official keyless API. Only models released within max_age_days surface.
  models_limit: 25
  max_age_days: 14
  timeout: 20

civitai:
  enabled: true
  priority: high
  # Official keyless API. Newest community image/video models, SFW only.
  models_limit: 25
  timeout: 20

hackernews:
  enabled: true
  priority: medium
  # Official Firebase API, keyless. AI-keyword filtered newest stories.
  max_items: 20
  check_latest: 40
  timeout: 10

reddit:
  enabled: false
  priority: medium
  # DISABLED by default: Reddit now returns 403 to anonymous .json requests
  # (login wall). Enable only after adding OAuth app credentials (future work).
  # Public .json endpoints, keyless. AI subreddits, score-filtered.
  max_per_sub: 8
  min_score: 5
  timeout: 15
  subreddits:
    - name: "LocalLLaMA"
      enabled: true
    - name: "StableDiffusion"
      enabled: true
    - name: "singularity"
      enabled: true
    - name: "artificial"
      enabled: true

arxiv:
  enabled: true
  priority: high
  queries:
    - "cat:cs.CL AND (llm OR agent OR rag OR reasoning)"
    - "cat:cs.CV AND (diffusion OR vision-language OR text-to-video)"
    - "cat:cs.RO AND (robotics OR embodied)"
    - "cat:cs.LG AND (distillation OR quantization OR efficient)"
  max_results: 15
  timeout: 20

rss:
  enabled: true
  priority: medium
  timeout: 15
  max_per_feed: 10
  sources:
    - name: "OpenAI Blog"
      url: "https://openai.com/blog/rss.xml"
      category: "news"
      enabled: true
      priority: high
    - name: "Google Research Blog"
      url: "https://research.google/blog/rss/"
      category: "research"
      enabled: true
      priority: high
    - name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
      category: "news"
      enabled: true
      priority: high
    - name: "MIT Technology Review AI"
      url: "https://www.technologyreview.com/feed/"
      category: "news"
      enabled: false
      priority: medium

official_blogs:
  enabled: true
  priority: high
  timeout: 15
  max_per_feed: 8
  sources:
    # NOTE: labs offer no public RSS, so these track press coverage via
    # Google News RSS (reliable, keyless). Names say "press" deliberately —
    # they are NOT official primary sources.
    - name: "Anthropic — press"
      url: "https://news.google.com/rss/search?q=Anthropic%20AI%20announcement&hl=en-US&gl=US&ceid=US:en"
      category: "news"
      enabled: true
      priority: high
      official: false
    - name: "DeepMind — press"
      url: "https://news.google.com/rss/search?q=Google%20DeepMind&hl=en-US&gl=US&ceid=US:en"
      category: "research"
      enabled: true
      priority: high
      official: false
    - name: "Meta AI — press"
      url: "https://news.google.com/rss/search?q=Meta%20AI%20announcement&hl=en-US&gl=US&ceid=US:en"
      category: "research"
      enabled: true
      priority: medium
      official: false

youtube:
  enabled: true
  priority: medium
  timeout: 15
  max_per_channel: 6
  # Channel IDs (RSS works with NO api key). Add/remove freely.
  # Human-friendly names only used for display.
  channels:
    - name: "Example AI Channel"
      channel_id: "UCbfYPyITQ-7l4upoX8nvctg"
      enabled: true
  # Used only if YOUTUBE_API_KEY is set; otherwise ignored.
  search_terms:
    - "new open source LLM"
    - "AI agent tutorial"
